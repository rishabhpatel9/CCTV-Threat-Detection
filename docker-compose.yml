version: '3.8'

services:
  api:
    build: .
    container_name: cctv-threat-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  streamlit-app:
    build: .
    container_name: cctv-threat-streamlit-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000/predict
    command: streamlit run app/streamlit-app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

  streamlit-webcam:
    build: .
    container_name: cctv-threat-streamlit-webcam
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000/predict
    command: streamlit run app/streamlit-webcam.py --server.port 8502 --server.address 0.0.0.0
    depends_on:
      - api
